name: Build Static MPV Linux

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  MPV_VERSION: "0.39.0"
  FFMPEG_VERSION: "7.1.1"
  LIBASS_VERSION: "0.17.3"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git devscripts equivs \
            autoconf automake build-essential cmake \
            libass-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libfontconfig1-dev \
            libssl-dev libdav1d-dev \
            libmp3lame-dev libtool libva-dev libvdpau-dev \
            libvorbis-dev libxcb1-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev meson ninja-build pkg-config \
            texinfo wget yasm zlib1g-dev \
            nasm libnuma-dev \
            libexpat1-dev libbrotli-dev libpng-dev libbz2-dev \
            libunibreak-dev libgraphite2-dev libpcre2-dev

      - name: Build LuaJIT
        run: |
          git clone https://github.com/LuaJIT/LuaJIT.git
          cd LuaJIT
          git checkout master
          sed -i "s/mixed/static/g" src/Makefile
          make -j$(nproc)
          sudo make install
          cd ..

      - name: Build static deps + MPV
        run: |
          set -e
          git clone https://github.com/mpv-player/mpv-build.git
          cd mpv-build
          ./use-libass-custom ${{ env.LIBASS_VERSION }}
          ./use-ffmpeg-custom n${{ env.FFMPEG_VERSION }}
          ./use-mpv-custom v${{ env.MPV_VERSION }}

          cat > ffmpeg_options <<'EOF'
          --enable-version3
          --enable-decoder=*
          --enable-parser=*
          --enable-muxer=mpeg1video
          --enable-muxer=mpeg2video
          --enable-muxer=mp3
          --enable-muxer=opus
          --enable-muxer=ass
          --enable-muxer=srt
          --enable-muxer=webvtt
          --enable-encoder=mpeg1video
          --enable-encoder=mpeg2video
          --enable-encoder=mp2
          --enable-encoder=mp3
          --enable-encoder=opus
          --enable-encoder=srt
          --enable-encoder=ass
          --disable-sndio
          --extra-cflags=-static
          --extra-ldflags=-static
          EOF

          cat > mpv_options <<'EOF'
          -Dlibmpv=false
          -Dalsa=disabled
          -Dpulse=disabled
          -Djack=disabled
          -Dsndio=disabled
          -Degl-x11=disabled
          -Dx11=disabled
          -Dwayland=disabled
          -Dgl=disabled
          -Dvulkan=disabled
          -Djavascript=disabled
          -Dpdf-build=disabled
          -Ddvdnav=disabled
          -Dcdda=disabled
          -Dlibarchive=disabled
          -Duchardet=disabled
          -Drubberband=disabled
          -Dzimg=disabled
          -Dlibbluray=disabled
          -Dlua=luajit
          -Dtests=false
          -Dmanpage-build=disabled
          -Dprefer_static=true
          EOF

          PREFIX="$GITHUB_WORKSPACE/mpv-build/build_libs"
          export PARALLEL=$(nproc)

          # Build ffmpeg + libass + mpv (dynamic deps) first
          cd "$GITHUB_WORKSPACE/mpv-build"
          ./rebuild

          echo "=== build_libs/lib/ after rebuild ==="
          ls -la build_libs/lib/ 2>/dev/null

          # Now build static versions of libs missing .a files on Ubuntu 24.04 Noble
          # Must happen AFTER rebuild so build_libs/ is fully populated and won't get cleaned
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig:$PREFIX/lib/x86_64-linux-gnu/pkgconfig"
          mkdir -p "$PREFIX/lib/pkgconfig"

          # libunibreak v6.1 (autotools) — installs to $PREFIX/lib/
          rm -rf /tmp/libunibreak
          git clone --depth 1 --branch libunibreak_6_1 https://github.com/adah1972/libunibreak.git /tmp/libunibreak
          cd /tmp/libunibreak
          ./autogen.sh
          ./configure --enable-static --disable-shared --prefix "$PREFIX"
          make -j$PARALLEL install

          # graphite2 v1.3.14 (cmake) — installs to $PREFIX/lib/
          rm -rf /tmp/graphite
          git clone --depth 1 --branch 1.3.14 https://github.com/silnrsi/graphite.git /tmp/graphite
          cmake -B/tmp/graphite/build -S/tmp/graphite -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build /tmp/graphite/build --target install

          # harfbuzz v9.0.0 (meson) — may install to $PREFIX/lib/x86_64-linux-gnu/
          rm -rf /tmp/harfbuzz
          git clone --depth 1 --branch 9.0.0 https://github.com/harfbuzz/harfbuzz.git /tmp/harfbuzz
          meson setup /tmp/harfbuzz/build /tmp/harfbuzz -Ddefault_library=static --prefix "$PREFIX" -Dglib=disabled -Dgobject=disabled -Dcairo=disabled -Dicu=disabled -Dfreetype=enabled -Dgraphite2=enabled
          ninja -C /tmp/harfbuzz/build install

          echo "=== build_libs/lib/ after static deps ==="
          ls -la "$PREFIX/lib/" | grep -E 'unibreak|graphite|harfbuzz'
          ls -la "$PREFIX/lib/x86_64-linux-gnu/" 2>/dev/null | grep -E 'unibreak|graphite|harfbuzz' || echo "(no x86_64-linux-gnu subdir)"

          # Reconfigure mpv with -static (avoids meson sanity check failure during setup)
          cd "$GITHUB_WORKSPACE/mpv-build/mpv"
          meson configure build -Dc_link_args="-static -L$PREFIX/lib -L$PREFIX/lib/x86_64-linux-gnu -lstdc++" -Dcpp_link_args="-static -L$PREFIX/lib -L$PREFIX/lib/x86_64-linux-gnu -lstdc++"
          ninja -C build -j$PARALLEL

      - name: Verify binary
        run: |
          file mpv-build/mpv/build/mpv
          if readelf -l mpv-build/mpv/build/mpv 2>/dev/null | grep -q INTERP; then
            echo "NOT fully static (has interpreter)"
            ldd mpv-build/mpv/build/mpv
          else
            echo "FULLY STATIC (no interpreter)"
          fi
          mpv-build/mpv/build/mpv --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static
          path: mpv-build/mpv/build/mpv

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mpv-build/mpv/build/mpv
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
