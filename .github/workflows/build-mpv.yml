name: Build Static MPV Linux

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

env:
  MPV_VERSION: "0.39.0"
  FFMPEG_VERSION: "7.1.1"
  LIBASS_VERSION: "0.17.3"

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git devscripts equivs \
            autoconf automake build-essential cmake \
            libass-dev libfreetype6-dev libharfbuzz-dev \
            libfribidi-dev libfontconfig1-dev \
            libssl-dev libdav1d-dev \
            libmp3lame-dev libtool libva-dev libvdpau-dev \
            libvorbis-dev libxcb1-dev libxcb-shm0-dev \
            libxcb-xfixes0-dev meson ninja-build pkg-config \
            texinfo wget yasm zlib1g-dev \
            nasm libnuma-dev \
            libexpat1-dev libbrotli-dev libpng-dev libbz2-dev \
            libunibreak-dev libgraphite2-dev libpcre2-dev

      - name: Build static deps from source (Ubuntu 24.04 Noble dropped .a files from -dev packages)
        run: |
          PREFIX="$GITHUB_WORKSPACE/mpv-build/build_libs"
          export PKG_CONFIG_PATH="$PREFIX/lib/pkgconfig"
          mkdir -p "$PREFIX/lib/pkgconfig"

          # Build libunibreak (provides -lunibreak)
          git clone --depth 1 https://github.com/adah1972/libunibreak.git /tmp/libunibreak
          cd /tmp/libunibreak
          meson setup build -Ddefault_library=static --prefix "$PREFIX"
          ninja -C build install

          # Build graphite2 (provides -lgraphite2)
          git clone --depth 1 https://github.com/silnrsi/graphite.git /tmp/graphite
          cd /tmp/graphite
          cmake -B build -DBUILD_SHARED_LIBS=OFF -DCMAKE_INSTALL_PREFIX="$PREFIX" -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build build --target install

          # Build harfbuzz (provides -lharfbuzz)
          git clone --depth 1 https://github.com/harfbuzz/harfbuzz.git /tmp/harfbuzz
          cd /tmp/harfbuzz
          meson setup build -Ddefault_library=static --prefix "$PREFIX" -Dglib=disabled -Dgobject=disabled -Dcairo=disabled -Dicu=disabled -Dfreetype=enabled -Dgraphite2=enabled
          ninja -C build install

          # Persist PKG_CONFIG_PATH for subsequent steps
          echo "PKG_CONFIG_PATH=$PREFIX/lib/pkgconfig" >> "$GITHUB_ENV"

      - name: Build LuaJIT
        run: |
          git clone https://github.com/LuaJIT/LuaJIT.git
          cd LuaJIT
          git checkout master
          sed -i "s/mixed/static/g" src/Makefile
          make -j$(nproc)
          sudo make install
          cd ..

      - name: Build MPV
        run: |
          git clone https://github.com/mpv-player/mpv-build.git
          cd mpv-build
          ./use-libass-custom ${{ env.LIBASS_VERSION }}
          ./use-ffmpeg-custom n${{ env.FFMPEG_VERSION }}
          ./use-mpv-custom v${{ env.MPV_VERSION }}

          cat > ffmpeg_options <<'EOF'
          --enable-version3
          --enable-decoder=*
          --enable-parser=*
          --enable-muxer=mpeg1video
          --enable-muxer=mpeg2video
          --enable-muxer=mp3
          --enable-muxer=opus
          --enable-muxer=ass
          --enable-muxer=srt
          --enable-muxer=webvtt
          --enable-encoder=mpeg1video
          --enable-encoder=mpeg2video
          --enable-encoder=mp2
          --enable-encoder=mp3
          --enable-encoder=opus
          --enable-encoder=srt
          --enable-encoder=ass
          --disable-sndio
          --extra-cflags=-static
          --extra-ldflags=-static
          EOF

          cat > mpv_options <<'EOF'
          -Dlibmpv=false
          -Dalsa=disabled
          -Dpulse=disabled
          -Djack=disabled
          -Dsndio=disabled
          -Degl-x11=disabled
          -Dx11=disabled
          -Dwayland=disabled
          -Dgl=disabled
          -Dvulkan=disabled
          -Djavascript=disabled
          -Dpdf-build=disabled
          -Ddvdnav=disabled
          -Dcdda=disabled
          -Dlibarchive=disabled
          -Duchardet=disabled
          -Drubberband=disabled
          -Dzimg=disabled
          -Dlibbluray=disabled
          -Dlua=luajit
          -Dtests=false
          -Dmanpage-build=disabled
          -Dprefer_static=true
          EOF

          ./rebuild -j$(nproc)

          # Reconfigure mpv with -static (avoids meson sanity check failure during setup)
          cd mpv
          meson configure build -Dc_link_args="-static" -Dcpp_link_args="-static"
          ninja -C build -j$(nproc)
          cd ..

      - name: Verify binary
        run: |
          file mpv-build/mpv/build/mpv
          if readelf -l mpv-build/mpv/build/mpv 2>/dev/null | grep -q INTERP; then
            echo "NOT fully static (has interpreter)"
            ldd mpv-build/mpv/build/mpv
          else
            echo "FULLY STATIC (no interpreter)"
          fi
          mpv-build/mpv/build/mpv --version

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: mpv-static
          path: mpv-build/mpv/build/mpv

      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: mpv-build/mpv/build/mpv
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
